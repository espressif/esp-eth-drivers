name: pre-commit

on:
  pull_request:
    types: [opened, reopened, synchronize]
  # release-please PRs are created via GITHUB_TOKEN; pull_request workflows then
  # require manual approval. Push events on these branches run pre-commit instead.
  push:
    branches:
      - 'release-please--**'

jobs:
  pre-commit:
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'release-please')
    runs-on: ubuntu-latest
    env:
      SKIP: 'pylint'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - uses: pre-commit/action@v3.0.1
